<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · Growth ERP</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="login-shell"><section class="login-card"><a class="brand" href="/login"><span class="brand-text">Growth ERP<small>GROW WITH YOUR BUSINESS</small></span></a><h1 id="login-title">다시 만나 반가워요</h1><p id="login-description" class="page-sub">계정으로 로그인하고 사업의 흐름을 확인하세요.</p><form id="login-form"><label class="field">아이디<input name="username" autocomplete="username" required maxlength="100"></label><label class="field">비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><label class="field" id="confirm-field" hidden>비밀번호 확인<input name="confirm" type="password" autocomplete="new-password" maxlength="256"></label><p id="login-error" class="form-error" role="alert"></p><button class="button primary" type="submit">로그인</button></form><p class="panel-caption">승인된 사용자만 이용할 수 있어요. 비밀번호를 잊었다면 관리자에게 계정 설정 링크를 요청하세요.</p></section></main><script type="module" src="/login.js"></script></body></html>
